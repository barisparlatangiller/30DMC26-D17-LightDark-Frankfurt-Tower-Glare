name: Build shadows + reflections and deploy map

# Day 17 · Light & dark. LoD2 buildings (HVBG) → towers ≥ 30 m + every roof around them → shadows (Day 5) and
# sunlight reflected by the glass towers of the façade inventory, on the 21st of each month every 30 minutes →
# web layers → LinkedIn time-lapse → GitHub Pages.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 150
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install tools
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q tippecanoe ffmpeg fonts-inter
          pip install -r requirements.txt
          mkdir -p logs input build docs/data

      - name: Cache LoD2 package
        uses: actions/cache@v4
        with:
          path: input/lod2
          key: frankfurt-lod2-v1-d17

      - name: Download LoD2 buildings (HVBG Geodaten online)
        run: |
          python pipeline/fetch_lod2.py 2>&1 | tee logs/01_fetch.log
          test ${PIPESTATUS[0]} -eq 0

      - name: LoD2 → footprints, heights, ground and roof elevations
        run: |
          python pipeline/lod2_to_buildings.py 2>&1 | tail -25 | tee logs/02_lod2.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Names of Frankfurt's buildings (OpenStreetMap, Overpass)
        continue-on-error: true
        run: python pipeline/fetch_osm_names.py 2>&1 | tee logs/02b_names.log

      - name: Towers ≥ 30 m, receivers, ground model, OSM join
        run: |
          python pipeline/build_casters.py 2>&1 | tee logs/03_casters.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Façade inventory → LoD2 towers
        run: |
          python pipeline/match_facades.py 2>&1 | tee logs/03b_facades.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Shadows, 12 days × every 30 minutes
        run: |
          python pipeline/shadows.py --workers 4 2>&1 | tee logs/04_shadows.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Reflections (reverse shadows of glass façades), 12 days × every 30 minutes
        run: |
          python pipeline/reflections.py --workers 4 2>&1 | tee logs/04b_reflections.log
          test ${PIPESTATUS[0]} -eq 0

      - name: Web layers (lost sun hours, hours of reflected sun, buildings tiles, tower stats)
        run: |
          python pipeline/build_web.py 2>&1 | grep -v "%" | tee logs/05_web.log
          test ${PIPESTATUS[0]} -eq 0

      - name: LinkedIn time-lapse (21 June, every 3 minutes)
        continue-on-error: true
        run: |
          python pipeline/video.py --workers 4 2>&1 | tee logs/05b_video.log
          mkdir -p docs/data/video && cp build/video/*.mp4 build/video/*.png docs/data/video/ || true

      - name: Summary
        if: always()
        run: |
          du -sh docs/data/* | tee logs/06_files.log
          du -sh docs/data/shadows/* docs/data/glare/* | tee -a logs/06_files.log
          python -c "import json;s=json.load(open('docs/data/stats.json'));print(json.dumps({k:s.get(k) for k in ['glarehours','glass_rank']},ensure_ascii=False)[:5000]);print({m:{k:d[k] for k in ['km2_30min','km2_1h','km2_2h','max_h']} for m,d in s['glare']['days'].items()})" 2>&1 | tee logs/07_glare_summary.log

      - name: Report (annotations readable via the API)
        if: always()
        run: |
          python - <<'PY'
          import glob, os
          def note(title, text):
              text = text[-3500:].replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::notice title={title}::{text}")
          for f in sorted(glob.glob("logs/*.log")):
              lines = [l for l in open(f, errors="replace").read().splitlines() if l.strip()]
              note(os.path.basename(f), "\n".join(lines[-45:]))
          PY

      - name: Publish result files to the 'data' branch (for QGIS users)
        continue-on-error: true
        run: |
          set -x
          mkdir -p /tmp/snap && cd /tmp/snap
          cp -r $GITHUB_WORKSPACE/docs/data site_data
          cp $GITHUB_WORKSPACE/build/facades.parquet $GITHUB_WORKSPACE/build/casters.parquet . || true
          mkdir -p video && cp $GITHUB_WORKSPACE/build/video/*.mp4 $GITHUB_WORKSPACE/build/video/*.png video/ || true
          cp -r $GITHUB_WORKSPACE/logs . || true
          find . -type f -size +95M -print -delete
          printf '# Result files\n\nBuilt by the GitHub Action from commit %s on %s.\nsite_data/ = everything the map loads (GeoJSON, PMTiles, PNG rasters, stats.json). video/ = LinkedIn time-lapse and stills.\n' "$GITHUB_SHA" "$(date -u +%F)" > README.md
          git init -q -b data && git add -A
          git -c user.name="github-actions" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -qm "Results of $GITHUB_SHA"
          git -c http.postBuffer=524288000 push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" data:data 2>&1 | tail -5

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: docs

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
